# CI pipeline for velos-platform (fixes audit finding P0-3 from Task 4-a:
# "no CI (.github absent); package.json has no typecheck script").
#
# Runs on every push to main / task/** branches and every PR targeting main,
# so the 264k LOC codebase and the 719 server-side tests are verified
# automatically instead of relying on manual local runs.
#
# The repo deploys to Vercel from main on every push — this pipeline is the
# quality gate that runs alongside (and before) those auto-deploys land.
name: CI

on:
  push:
    branches:
      - main
      - "task/**"
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Lint + Typecheck + Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --legacy-peer-deps is required (peer-dep conflicts in the lockfile,
      # same flag used for all local installs of this project).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # The Prisma client must be generated into node_modules before tsc runs,
      # otherwise typecheck fails with "prisma client not generated" errors.
      - name: Generate Prisma client
        run: npx prisma generate

      # Baseline (2026-09): eslint . exits 0 with 0 errors / ~1073 warnings.
      # The step fails on errors; warnings are tolerated at this baseline.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
